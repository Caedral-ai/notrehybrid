[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notrehybrid"
version = "0.0.0"
description = "Caedral research: test whether a trainable collision cache, triggered by Gated DeltaNet delta error, improves Transformer linearization enough for a methods paper."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Caedral", email = "support@caedral.com" }]
dependencies = [
    "torch",
    "flash-linear-attention",
    "transformers",
    "datasets",
    "huggingface_hub",
    "peft",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://caedral.com"
Repository = "https://github.com/Caedral-ai/notrehybrid"
Issues = "https://github.com/Caedral-ai/notrehybrid/issues"

[tool.setuptools.packages.find]
include = ["notre*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
